<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DT–SDLC Skill 安裝流程</title>
  <desc id="desc">從 GitHub 下載、執行安裝、重新啟動 Codex，再用範例提示驗證。</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg2)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" font-weight="700" fill="#0f172a">四步完成安裝</text>
  <text x="600" y="91" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" fill="#475569">Windows 可執行安裝程式；其他系統可手動複製三個 Skill 資料夾</text>
  <g filter="url(#s)" font-family="Arial, 'Noto Sans TC', sans-serif">
    <g transform="translate(45 135)"><rect width="245" height="190" rx="22" fill="#fff" stroke="#0891b2" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#0891b2"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text><text x="122" y="91" text-anchor="middle" font-size="22" font-weight="700" fill="#164e63">取得專案</text><text x="122" y="126" text-anchor="middle" font-size="16" fill="#334155">Git clone 或 Download ZIP</text><text x="122" y="157" text-anchor="middle" font-size="15" fill="#64748b">profchwu/DT_SDLC_Skill</text></g>
    <g transform="translate(335 135)"><rect width="245" height="190" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#7c3aed"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text><text x="122" y="91" text-anchor="middle" font-size="22" font-weight="700" fill="#5b21b6">安裝 Skills</text><text x="122" y="126" text-anchor="middle" font-size="16" fill="#334155">執行 INSTALL_SKILLS.ps1</text><text x="122" y="157" text-anchor="middle" font-size="15" fill="#64748b">或手動複製三個資料夾</text></g>
    <g transform="translate(625 135)"><rect width="245" height="190" rx="22" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#2563eb"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text><text x="122" y="91" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">重新啟動</text><text x="122" y="126" text-anchor="middle" font-size="16" fill="#334155">重新啟動 Codex</text><text x="122" y="157" text-anchor="middle" font-size="15" fill="#64748b">或開啟新的工作階段</text></g>
    <g transform="translate(915 135)"><rect width="245" height="190" rx="22" fill="#fff" stroke="#16a34a" stroke-width="3"/><circle cx="42" cy="42" r="24" fill="#16a34a"/><text x="42" y="50" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">4</text><text x="122" y="91" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">驗證使用</text><text x="122" y="126" text-anchor="middle" font-size="16" fill="#334155">請使用 dt-sdlc</text><text x="122" y="157" text-anchor="middle" font-size="15" fill="#64748b">從構想到可部署產品</text></g>
  </g>
  <g fill="#64748b"><path d="M298 228h27l-10-10 8-8 24 24-24 24-8-8 10-10h-27z"/><path d="M588 228h27l-10-10 8-8 24 24-24 24-8-8 10-10h-27z"/><path d="M878 228h27l-10-10 8-8 24 24-24 24-8-8 10-10h-27z"/></g>
  <rect x="330" y="354" width="540" height="40" rx="20" fill="#0f172a"/><text x="600" y="380" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="16" font-weight="600" fill="#fff">安裝位置：$CODEX_HOME/skills 或 ~/.codex/skills</text>
</svg>
