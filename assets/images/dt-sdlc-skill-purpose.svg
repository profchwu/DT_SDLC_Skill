<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">DT–SDLC Skill 的目的</title>
  <desc id="desc">從模糊構想到可驗收產品，依序由 Design Thinking、需求交接與 Software Development Life Cycle 完成。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334155" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" font-weight="700" fill="#0f172a">從模糊構想到可驗收產品</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" fill="#475569">用人本探索降低做錯產品的風險，用工程流程提高交付品質</text>
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="300" height="250" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="205" cy="205" r="38" fill="#ede9fe"/><path d="M186 207h38M205 188v38" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
    <text x="205" y="270" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#5b21b6">Design Thinking</text>
    <text x="205" y="308" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" fill="#334155">理解人與問題</text>
    <text x="205" y="338" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" fill="#334155">比較並驗證方案</text>
    <text x="205" y="368" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" fill="#334155">形成核准需求</text>
    <rect x="450" y="185" width="300" height="170" rx="85" fill="#0f766e"/>
    <text x="600" y="245" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#ffffff">需求交接與決策關卡</text>
    <text x="600" y="282" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="16" fill="#ccfbf1">輸入・處理・輸出・限制</text>
    <text x="600" y="310" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="16" fill="#ccfbf1">角色・驗收・安全・部署</text>
    <rect x="845" y="145" width="300" height="250" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="995" cy="205" r="38" fill="#dbeafe"/><path d="M977 205l12 12 25-28" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="995" y="270" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">Software Development Life Cycle</text>
    <text x="995" y="308" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" fill="#334155">設計並實作系統</text>
    <text x="995" y="338" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" fill="#334155">測試與安全檢查</text>
    <text x="995" y="368" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" fill="#334155">部署、維運與驗收</text>
  </g>
  <path d="M365 270h68" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><path d="M425 258l14 12-14 12" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M760 270h68" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><path d="M820 258l14 12-14 12" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="228" y="435" width="744" height="48" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="466" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" font-weight="600" fill="#334155">動態提問 ・ 階段核准 ・ 需求追溯 ・ 介面品質 ・ 部署與安全</text>
</svg>
